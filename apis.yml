aid: convergent-therapeutics
name: Convergent Therapeutics
description: 'Convergent Therapeutics, Inc. is a clinical-stage biotechnology company
  based in Cambridge, Massachusetts, developing next-generation targeted radiotherapies
  for cancer. Founded in 2020 by Philip Kantoff, the company builds alpha radioantibodies
  that pair a humanized monoclonal antibody against prostate-specific membrane antigen
  (PSMA) with the alpha emitter actinium-225, delivering short-range, high-energy alpha
  radiation to tumor cells. Its lead candidate, CONV01-alpha (rosopatamab tetraxetan),
  is in the Phase 2 CONVERGE-01 trial in metastatic castration-resistant prostate cancer,
  including patients previously treated with Lu-177 PSMA radioligand therapy, with a
  pivotal Phase 3 planned. Convergent announced a $90 million Series A financing in 2023.
  The company publishes a corporate website covering its pipeline, technology, scientific
  publications and press, but operates no public developer program, API, SDK, or
  machine-readable API contract.'
